services:
  - type: web
    name: gomoku-online
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGIN
        value: https://tingchuchi.github.io
      - key: NODE_ENV
        value: production

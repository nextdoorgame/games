services:
  - type: web
    name: gomoku-online
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGIN
        # The API uses player IDs in request bodies rather than cookies, so a
        # wildcard safely supports both the legacy and nextdoorgame Pages sites.
        value: "*"
      - key: NODE_ENV
        value: production

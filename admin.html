<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>隔壁同樂室｜管理後台</title>
    <style>
      :root{font-family:"Noto Sans TC",system-ui,sans-serif;color:#403126;background:#f8f3e9}*{box-sizing:border-box}body{margin:0;background:repeating-linear-gradient(90deg,#fffdf8 0 36px,#f3e7d1 37px 39px);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:36px 20px}.panel{background:#fffdf9eF;border:1px solid #dfcda9;border-radius:18px;box-shadow:0 15px 35px #8c6c3a25;padding:24px;margin:18px 0}h1{margin:0;font-size:28px}p{color:#75634d}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.login{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;border-radius:9px;padding:10px 12px;border:1px solid #ccb98f}button{cursor:pointer;background:#795a32;color:white;border:0}button.secondary{background:#eee2ce;color:#563d22}button.danger{background:#a94236}button:disabled{opacity:.5;cursor:not-allowed}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #eadcc5}th{color:#806746;font-size:13px}small{color:#866f52}.actions{display:flex;gap:7px}.hidden{display:none}.error{color:#a94236;font-weight:700}.balance{font-variant-numeric:tabular-nums;color:#8a5420;font-weight:700}@media(max-width:700px){.wrap{padding:22px 12px}.top{align-items:flex-start;flex-direction:column}table{font-size:13px}th:nth-child(1),td:nth-child(1){display:none}.actions{flex-direction:column}}
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="panel top"><div><h1>♪ 隔壁同樂室管理後台</h1><p>帳號與織音幣管理僅限管理員使用。</p></div><a href="./index.html"><button class="secondary">回到同樂室</button></a></section>
      <section class="panel" id="loginPanel"><h2>管理員登入</h2><div class="login"><input id="username" autocomplete="username" placeholder="帳號"><input id="password" type="password" autocomplete="current-password" placeholder="密碼"><button id="loginButton">登入後台</button></div><p id="loginMessage" class="error" role="alert"></p></section>
      <section class="panel hidden" id="adminPanel"><div class="top"><div><h2 id="adminName">帳號管理</h2><p id="summary">讀取中…</p></div><button id="refreshButton" class="secondary">重新整理</button></div><p id="adminMessage" class="error" role="alert"></p><table><thead><tr><th>帳號 ID</th><th>帳號／玩家名稱</th><th>織音幣</th><th>最後更新</th><th>操作</th></tr></thead><tbody id="accountsBody"></tbody></table></section>
    </main>
    <script src="./config.js"></script>
    <script type="module" src="./src/admin.js"></script>
  </body>
</html>
